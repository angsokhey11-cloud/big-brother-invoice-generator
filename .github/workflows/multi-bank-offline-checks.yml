name: Multi-bank offline safety checks

on:
  push:
    branches:
      - feature/multi-source-wallet-20261026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: multibank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d multibank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify wallet calculations
        run: node preview/multi-source-wallet-preview.test.cjs
      - name: Verify bank-save source contract
        run: node preview/multi-bank-contract.test.cjs
      - name: Parse browser scripts
        run: |
          node --check preview/multi-source-wallet-preview.js
          node --check preview/multi-source-wallet-panel.js
          node --check bank-payment-protection-v2.js
          node --check invoice-bank-currency-equivalent-v1.js
          node --check supabase-adapter.js
      - name: Validate SQL syntax without connecting to a database
        run: |
          python3 - <<'PY'
          import pathlib
          sql=pathlib.Path('sql/multi-bank-atomic-invoice-save-v1.sql').read_text()
          assert sql.count('$fn$') == 2, 'PL/pgSQL body delimiters damaged'
          assert sql.rstrip().endswith('commit;'), 'SQL must end with COMMIT'
          assert sql.count('\ncommit;') == 1, 'Unexpected duplicate migration block'
          print('Basic SQL structural checks passed (not a PostgreSQL parse).')
          PY

      - name: Real PostgreSQL atomic invoice tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d multibank_test -f preview/fixtures/multi-bank-pg-setup.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d multibank_test -f preview/fixtures/multi-bank-production-guard.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d multibank_test -f sql/multi-bank-atomic-invoice-save-v1.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d multibank_test -f preview/fixtures/multi-bank-pg-assert.sql

      - name: Install isolated Chromium browser tester
        run: |
          python3 -m pip install --user 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium
      - name: Real Chromium bank wallet UI interactions
        run: python3 preview/fixtures/multi-bank-browser.smoke.py
      - name: Actual bank equivalent reset when switching customers
        run: python3 preview/fixtures/bank-equivalent-customer-reset.browser.py
      - name: Real Invoice Generator adapter browser save and recovery
        run: python3 preview/fixtures/multi-bank-adapter-browser.test.py
      - name: Desktop Complete Invoice end-to-end handoff in Chromium
        run: python3 preview/fixtures/multi-bank-legacy-complete.browser.test.py
      - name: Full user-facing multi-bank workflow preview in Chromium
        run: python3 preview/fixtures/multi-bank-workflow-demo.browser.test.py
      - name: Concurrent wallet double-spend protection (two database sessions)
        env:
          PGPASSWORD: postgres
        run: python3 preview/fixtures/multi-bank-concurrency.test.py
