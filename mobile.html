<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8">
  <title>BIG BROTHER — Invoice Generator Mobile</title>
  <style>
    html,body{margin:0;min-height:100%;background:#eef3f8;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#173b70}
    .bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .bb-loader-card{background:#fff;border:1px solid #d7e2ef;border-radius:16px;padding:22px 28px;box-shadow:0 12px 30px rgba(21,49,83,.08);font-weight:800}
    .bb-loader-sub{margin-top:7px;font-size:12px;color:#6d7f92;font-weight:600}
  </style>
  <script src="dual-currency-invoice-patch.js?v=20260910-1"></script>
</head>
<body>
  <div class="bb-loader">
    <div class="bb-loader-card">
      Loading BIG BROTHER Invoice Generator…
      <div class="bb-loader-sub">Mobile · Secure Supabase</div>
    </div>
  </div>

<script>
(async function(){
  'use strict';

  const SUPABASE_URL='https://sjfhlaclgmkwwofzstok.supabase.co';
  const SUPABASE_KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S';
  const SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';

  function readSession(){
    try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}
  }

  function saveSession(value){
    try{
      if(!value){localStorage.removeItem(SESSION_KEY);return}
      if(!value.expires_at&&value.expires_in)value.expires_at=Math.floor(Date.now()/1000)+Number(value.expires_in);
      localStorage.setItem(SESSION_KEY,JSON.stringify(value));
    }catch(_){}
  }

  async function parse(response){
    const text=await response.text();
    let data={};
    try{data=text?JSON.parse(text):{}}catch(_){data={message:text}}
    if(!response.ok)throw new Error(data.message||data.error_description||data.error||('Request failed ('+response.status+')'));
    return data;
  }

  async function ensureSession(){
    let session=readSession();
    if(!session?.access_token)throw new Error('Please sign in to BIG BROTHER first.');
    const now=Math.floor(Date.now()/1000);
    if(session.expires_at&&Number(session.expires_at)<now+45){
      if(!session.refresh_token)throw new Error('Your BIG BROTHER session has expired.');
      const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',
        headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:session.refresh_token}),
        cache:'no-store'
      });
      session=await parse(r);
      saveSession(session);
    }
    return session;
  }

  async function rpc(fn,args={}){
    const session=await ensureSession();
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
      method:'POST',
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:'Bearer '+session.access_token,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(args||{}),
      cache:'no-store'
    });
    return parse(r);
  }

  async function assertInvoicePermission(){
    const profile=await rpc('bb_current_access_profile');
    if(profile?.user?.isAdmin===true)return;
    const modules=Array.isArray(profile?.modules)?profile.modules:[];
    const key=v=>String(v||'').trim().toLowerCase();
    const grant=modules.find(x=>key(x.moduleKey)==='*')||modules.find(x=>key(x.moduleKey)==='route.invoice');
    if(!grant||grant.canView!==true||grant.canCreate!==true){
      throw new Error('You do not have permission to create Sales Invoices.');
    }
  }

  try{
    await assertInvoicePermission();

    const [sourceResponse,adapterResponse]=await Promise.all([
      fetch('legacy-google-v2.4.5.html?v=20260913-1',{cache:'no-store'}),
      fetch('supabase-adapter.js?v=20260913-1',{cache:'no-store'})
    ]);

    if(!sourceResponse.ok)throw new Error('Could not load Invoice Generator source.');
    if(!adapterResponse.ok)throw new Error('Could not load Invoice Generator Supabase adapter.');

    let html=await sourceResponse.text();
    let adapterJs=await adapterResponse.text();

    if(!window.BBInvoiceDualCurrencyPatch)throw new Error('Invoice dual-currency patch did not load.');

    html=window.BBInvoiceDualCurrencyPatch.patchLegacy(html);
    adapterJs=window.BBInvoiceDualCurrencyPatch.patchAdapter(adapterJs);

    html=html.replace('loadNextInvoiceNumber();','/* Supabase boot owns Invoice No. */');
    html=html.replace('loadInvoiceBootstrapFast();','/* Supabase boot owns Master bootstrap. */');
    html=html.replace('loadSimpleBatchPicker();','/* Supabase boot owns Batch picker. */');

    html=html.replaceAll(
      'This will save the invoice to the Sales Data Google Sheet.',
      'This will save the invoice to the BIG BROTHER Database.'
    );
    html=html.replaceAll(
      'Google Sheets -> separate Sales Data file',
      'Supabase PostgreSQL -> Sales Database'
    );
    html=html.replace(
      '<title>BIG BROTHER — Invoice Generator V2.4.5 Fast Master Bootstrap</title>',
      '<title>BIG BROTHER — Invoice Generator Mobile</title>'
    );

    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Invoice Generator source is missing </head>.');
    html=html.slice(0,headClose)
      +'<link rel="stylesheet" href="mobile-invoice.css?v=20260914-1">\n'
      +'<link rel="stylesheet" href="mobile-invoice-preview.css?v=20260914-1">\n'
      +html.slice(headClose);

    const safeAdapter=adapterJs.replace(/<\/script/gi,'<\\/script');
    const featureScripts=
      '<scr'+'ipt>'+safeAdapter+'</scr'+'ipt>\n'
      +'<scr'+'ipt src="batch-v2-invoice-guard.js?v=20260910-2"></scr'+'ipt>\n'
      +'<scr'+'ipt src="direct-sale-source-v1.js?v=20260913-1"></scr'+'ipt>\n'
      +'<scr'+'ipt src="invoice-backup-v1.js?v=20260916-1"></scr'+'ipt>\n'
      +'<scr'+'ipt src="mobile-invoice.js?v=20260914-1"></scr'+'ipt>\n'
      +'<scr'+'ipt src="mobile-invoice-preview.js?v=20260914-1"></scr'+'ipt>';

    const bodyCloseIndex=html.toLowerCase().lastIndexOf('</body>');
    if(bodyCloseIndex<0)throw new Error('Invoice Generator source is missing its closing body tag.');
    html=html.slice(0,bodyCloseIndex)+featureScripts+'\n'+html.slice(bodyCloseIndex);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Invoice Generator mobile loader failed:',error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-loader-card">Could not open Invoice Generator<div class="bb-loader-sub">'+String(error?.message||error).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))+'</div></div></div>';
  }
})();
</script>
</body>
</html>
