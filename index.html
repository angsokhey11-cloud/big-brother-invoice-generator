<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    BIG BROTHER — Invoice Generator
  </title>


  <style>

    html,
    body{

      margin:0;

      min-height:100%;

      background:#eef3f8;

      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      color:#173b70;

    }


    .bb-loader{

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:24px;

      text-align:center;

    }


    .bb-loader-card{

      background:#fff;

      border:1px solid #d7e2ef;

      border-radius:16px;

      padding:22px 28px;

      box-shadow:
        0 12px 30px
        rgba(21,49,83,.08);

      font-weight:800;

    }


    .bb-loader-sub{

      margin-top:7px;

      font-size:12px;

      color:#6d7f92;

      font-weight:600;

    }

  </style>


  <script
    src="dual-currency-invoice-patch.js?v=20260930-price4"
  ></script>

</head>


<body>


  <div class="bb-loader">

    <div class="bb-loader-card">

      Loading BIG BROTHER Invoice Generator…

      <div class="bb-loader-sub">
        Secure Supabase · Purchased + Zero-Cost Direct Sale
      </div>

    </div>

  </div>



  <script>

  (async function () {


    try {


      /* =======================================================
         LOAD LEGACY UI + SUPABASE ADAPTER
         ======================================================= */

      const [
        sourceResponse,
        adapterResponse
      ] =
        await Promise.all([

          fetch(
            'desktop-source-v20260924-invoiceseq1.html?v=20261011-v354-sized-right',
            {
              cache:'no-store'
            }
          ),

          fetch(
            'supabase-adapter.js?v=20261005-bank-autofill1',
            {
              cache:'no-store'
            }
          )

        ]);



      if (
        !sourceResponse.ok
      ) {

        throw new Error(
          'Could not load Invoice Generator source.'
        );

      }


      if (
        !adapterResponse.ok
      ) {

        throw new Error(
          'Could not load Invoice Generator Supabase adapter.'
        );

      }



      let html =
        await sourceResponse.text();


      if (
        !html.includes('function bbConfirmInvoiceCompletion(payload)') ||
        !html.includes('20260924-invoiceseq1')
      ) {
        throw new Error(
          'Desktop Invoice Generator confirmation source is stale.'
        );
      }


      let adapterJs =
        await adapterResponse.text();

      const dialogTag='<scr'+'ipt src="https://angsokhey11-cloud.github.io/big-brother-dashboard/bb-system-dialog-v1.js?v=20261005-dialog2"></scr'+'ipt>';
      const dialogHeadClose=html.toLowerCase().indexOf('</head>');
      if(dialogHeadClose>=0)html=html.slice(0,dialogHeadClose)+dialogTag+'\n'+html.slice(dialogHeadClose);



      /* =======================================================
         DUAL CURRENCY PATCH
         ======================================================= */

      if (
        !window.BBInvoiceDualCurrencyPatch
      ) {

        throw new Error(
          'Invoice dual-currency patch did not load.'
        );

      }


      html =
        window
          .BBInvoiceDualCurrencyPatch
          .patchLegacy(
            html
          );


      adapterJs =
        window
          .BBInvoiceDualCurrencyPatch
          .patchAdapter(
            adapterJs
          );


      /* =======================================================
         DESKTOP-ONLY FAST ENTRY PATCHES
         - Currency switch never rewrites keyed product prices.
         - Missing Payment Method opens the native picker directly.
         Mobile does not use this loader.
         ======================================================= */

      html = html.replace(
`function changeCurrency() {
  const currency = getCurrency();
  const rate = getExchangeRate();

  if(currency === "KHR" && rate <= 0) {
    alert("Please enter a valid exchange rate.");
    document.getElementById("currency").value = "USD";
    return;
  }

  document.querySelectorAll("#productList .product").forEach(row => {
    const lineId = row.dataset.lineId || "";
    const item = selectedProducts.find(p => p.id === lineId);
    const product = getInvoiceSearchPool().find(
      p => p.code === (row.dataset.productCode || "") || p.name === (row.dataset.product || "")
    );

    if(item && product && !item.manualPrice) {
      const canonical = getPriceForProduct(product);
      item.usdPrice = canonical;
      row.dataset.usdPrice = canonical;
    }

    const priceInput = row.querySelector(".product-price-input");
    if(priceInput) {
      const canonical = Number(row.dataset.usdPrice) || 0;
      priceInput.value = usdToSelected(canonical, currency);
      priceInput.step = currency === "KHR" ? "1" : "0.0001";
    }
  });

  calculate();
}`,
`function changeCurrency() {
  const currency = getCurrency();
  const rate = getExchangeRate();

  if(currency === "KHR" && rate <= 0) {
    alert("Please enter a valid exchange rate.");
    document.getElementById("currency").value = "USD";
    return;
  }

  document.querySelectorAll("#productList .product").forEach(row => {
    const priceInput = row.querySelector(".product-price-input");
    if(priceInput) {
      priceInput.step = currency === "KHR" ? "1" : "0.0001";
    }
  });

  calculate();
}`
      );

      html = html.replace(
`  if (!payload.paymentMethod) {
    alert("Please select a Payment Method before completing the invoice.");
    return;
  }`,
`  if (!payload.paymentMethod) {
    const paymentSelect = document.getElementById("paymentMethod");
    if (paymentSelect) {
      try { paymentSelect.focus({preventScroll:true}); } catch (_) { paymentSelect.focus(); }
      try {
        if (typeof paymentSelect.showPicker === "function") paymentSelect.showPicker();
        else paymentSelect.click();
      } catch (_) {
        try { paymentSelect.click(); } catch (__) {}
      }
    }
    return;
  }`
      );



      /* =======================================================
         SUPABASE OWNS STARTUP
         ======================================================= */

      html =
        html.replace(

          'loadNextInvoiceNumber();',

          '/* Supabase boot owns Invoice No. */'

        );


      html =
        html.replace(

          'loadInvoiceBootstrapFast();',

          '/* Supabase boot owns Master bootstrap. */'

        );


      html =
        html.replace(

          'loadSimpleBatchPicker();',

          '/* Supabase boot owns Batch picker. */'

        );



      /* =======================================================
         DATABASE TEXT
         ======================================================= */

      html =
        html.replaceAll(

          'This will save the invoice to the Sales Data Google Sheet.',

          'This will save the invoice to the BIG BROTHER Database.'

        );


      html =
        html.replaceAll(

          'Google Sheets -> separate Sales Data file',

          'Supabase PostgreSQL -> Sales Database'

        );



      /* =======================================================
         TITLE
         ======================================================= */

      html =
        html.replace(

          '<title>BIG BROTHER — Invoice Generator V2.4.5 Fast Master Bootstrap</title>',

          '<title>BIG BROTHER — Invoice Generator V3.4 Product Buttons</title>'

        );



      /* =======================================================
         INJECT SUPABASE + STOCK SOURCE FEATURES

         ORDER MATTERS:

         1. Supabase Adapter
         2. Batch Sale Guard
         3. Direct Sale Source Selector
         4. Confirmed Invoice Backup

         Therefore:
         Batch Sale stays Zero-Cost First.
         Direct Sale becomes manual Purchased / Zero-Cost / Mixed.
         Confirmed Supabase invoices are mirrored to Google Sheets.
         ======================================================= */

      const safeAdapter =

        adapterJs.replace(
          /<\/script/gi,
          '<\\/script'
        );


      const featureScripts =

        '<scr'
        +
        'ipt>'
        +
        safeAdapter
        +
        '</scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="batch-v2-invoice-guard.js?v=20260930-service2"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="direct-sale-source-v1.js?v=20260930-service2"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="desktop-product-picker-v1.js?v=20261004-keyboard-wrap2"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="invoice-price-comma-decimal-v1.js?v=20260925-1"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="invoice-backup-desktop-v2.js?v=20260924-invoiceseq1"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="split-payment-v1.js?v=20260924-cashbank1"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="invoice-selling-units-v1.js?v=20260926-liveunits1"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="invoice-ar-summary-v1.js?v=20260921-textonly1"></scr'
        +
        'ipt>\n'

        +

        '<scr'
        +
        'ipt src="telegram-invoice-share-v1.js?v=20261003-upload-pending1"></scr'
        +
        'ipt>\n'
        +
        '<scr'
        +
        'ipt src="bank-payment-protection-v2.js?v=20261011-customer-balance-header1"></scr'
        +
        'ipt>\n'
        +
        '<scr'+'ipt src="customer-keyboard-navigation-v1.js?v=20261010-portal-location5"></scr'+'ipt>\n'
        +
        '<scr'+'ipt src="desktop-input-behavior-v1.js?v=20261004-desktop-input6"></scr'
        +
        'ipt>\n'
        +
        '<scr'
        +
        'ipt src="desktop-invoice-range-v1.js?v=20261004-invoice-range4"></scr'
        +
        'ipt>\n'
        +
        '<scr'
        +
        'ipt src="invoice-currency-safety-v1.js?v=20261004-currency-safety1"></scr'
        +
        'ipt>\n'
        +
        '<scr'
        +
        'ipt src="invoice-customer-bank-balance-header-v1.js?v=20261011-v354-sized-right"></scr'
        +
        'ipt>';



      /* =======================================================
         INSERT BEFORE FINAL BODY CLOSE
         ======================================================= */

      const bodyCloseIndex =

        html
          .toLowerCase()
          .lastIndexOf(
            '</body>'
          );


      if (
        bodyCloseIndex
        <
        0
      ) {

        throw new Error(
          'Invoice Generator source is missing its closing body tag.'
        );

      }


      html =

        html.slice(
          0,
          bodyCloseIndex
        )

        +

        featureScripts

        +

        '\n'

        +

        html.slice(
          bodyCloseIndex
        );



      /* =======================================================
         OPEN FINAL APP
         ======================================================= */

      document.open();

      document.write(
        html
      );

      document.close();



    } catch (error) {


      console.error(
        'Invoice Generator loader failed:',
        error
      );


      document.body.innerHTML =

        '<div class="bb-loader">'

        +

        '<div class="bb-loader-card">'

        +

        'Could not open Invoice Generator'

        +

        '<div class="bb-loader-sub">'

        +

        String(
          error?.message
          ||
          error
        )

        +

        '</div>'

        +

        '</div>'

        +

        '</div>';


    }


  })();

  </script>


</body>

</html>
