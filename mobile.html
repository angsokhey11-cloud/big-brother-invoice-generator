<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8">
  <title>BIG BROTHER — Invoice Generator Mobile</title>

  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:#eef3f8;
      font-family:"Segoe UI",Tahoma,Arial,sans-serif;
      color:#173b70;
    }
    .bb-loader{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      text-align:center;
    }
    .bb-loader-card{
      background:#fff;
      border:1px solid #d7e2ef;
      border-radius:16px;
      padding:22px 28px;
      box-shadow:0 12px 30px rgba(21,49,83,.08);
      font-weight:800;
    }
    .bb-loader-sub{
      margin-top:7px;
      font-size:12px;
      color:#6d7f92;
      font-weight:600;
    }
  </style>

  <script src="dual-currency-invoice-patch.js?v=20260910-1"></script>
</head>

<body>
  <div class="bb-loader">
    <div class="bb-loader-card">
      Loading BIG BROTHER Invoice Generator…
      <div class="bb-loader-sub">
        Mobile · Desktop Supabase Core
      </div>
    </div>
  </div>

  <script>
  (async function(){
    'use strict';

    try{
      /*
       * MOBILE CORE RESET V1
       * --------------------
       * Use the exact same Invoice source + Supabase adapter path
       * as the working Desktop Invoice Generator.
       *
       * Mobile differences are added only AFTER the core is prepared:
       * CSS, mobile controller, preview, keyboard fixes, etc.
       */

      const [sourceResponse,adapterResponse]=await Promise.all([
        fetch(
          'desktop-source-v20260924-invoiceseq1.html?v=20260924-invoiceseq1',
          {cache:'no-store'}
        ),
        fetch(
          'supabase-adapter.js?v=20260925-sellingunits1',
          {cache:'no-store'}
        )
      ]);

      if(!sourceResponse.ok){
        throw new Error('Could not load Invoice Generator source.');
      }

      if(!adapterResponse.ok){
        throw new Error('Could not load Invoice Generator Supabase adapter.');
      }

      let html=await sourceResponse.text();
      let adapterJs=await adapterResponse.text();

      /*
       * Same stale-source guard used by Desktop.
       */
      if(
        !html.includes('function bbConfirmInvoiceCompletion(payload)') ||
        !html.includes('20260924-invoiceseq1')
      ){
        throw new Error('Invoice Generator core source is stale.');
      }

      if(!window.BBInvoiceDualCurrencyPatch){
        throw new Error('Invoice dual-currency patch did not load.');
      }

      /*
       * EXACT DESKTOP CORE PATCHING.
       */
      html=window.BBInvoiceDualCurrencyPatch.patchLegacy(html);
      adapterJs=window.BBInvoiceDualCurrencyPatch.patchAdapter(adapterJs);

      /*
       * Supabase owns startup, exactly like Desktop.
       * Disable only the legacy Google startup calls.
       */
      html=html.replace(
        'loadNextInvoiceNumber();',
        '/* Supabase boot owns Invoice No. */'
      );

      html=html.replace(
        'loadInvoiceBootstrapFast();',
        '/* Supabase boot owns Master bootstrap. */'
      );

      html=html.replace(
        'loadSimpleBatchPicker();',
        '/* Supabase boot owns Batch picker. */'
      );

      /*
       * MOBILE ONLY — keep iOS number keyboard/focus behavior.
       * Core data/bootstrap logic is not modified here.
       */
      const bbIOSInvoice=
        /iPhone|iPad|iPod/i.test(navigator.userAgent||'') ||
        (navigator.platform==='MacIntel' && Number(navigator.maxTouchPoints||0)>1);

      if(bbIOSInvoice){
        html=html.replace(
`  setTimeout(() => {
    qtyInput.focus();
    qtyInput.select();
  }, 35);`,
`  void modal.offsetHeight;
  try{
    qtyInput.focus({preventScroll:true});
  }catch(_){
    qtyInput.focus();
  }
  try{
    qtyInput.select();
  }catch(_){}
`
        );

        html=html.replace(
`  setTimeout(() => {
    input.focus();
    input.select();
  }, 35);`,
`  void modal.offsetHeight;
  try{
    input.focus({preventScroll:true});
  }catch(_){
    input.focus();
  }
  try{
    input.select();
  }catch(_){}
`
        );
      }

      /*
       * Current database wording.
       */
      html=html.replaceAll(
        'This will save the invoice to the Sales Data Google Sheet.',
        'This will save the invoice to the BIG BROTHER Database.'
      );

      html=html.replaceAll(
        'Google Sheets -> separate Sales Data file',
        'Supabase PostgreSQL -> Sales Database'
      );

      html=html.replace(
        '<title>BIG BROTHER — Invoice Generator V2.4.5 Fast Master Bootstrap</title>',
        '<title>BIG BROTHER — Invoice Generator Mobile</title>'
      );

      /*
       * MOBILE TELEGRAM FLOW
       * Preserve the exact saved invoice result for Telegram routing.
       */
      const bbInvoiceSaveMarker=
        '    await postSalesInvoiceBundle(payload, paymentPayload);';

      const bbInvoiceSaveReplacement=
        '    const bbSavedInvoiceResult =\n'
        +'      await postSalesInvoiceBundle(payload, paymentPayload);';

      if(!html.includes(bbInvoiceSaveMarker)){
        throw new Error('Mobile Invoice save-result marker was not found.');
      }

      html=html.replace(
        bbInvoiceSaveMarker,
        bbInvoiceSaveReplacement
      );

      const bbInvoiceClearMarker=
        '    clearAllAfterSuccessfulSave();';

      const bbInvoiceTelegramBeforeClear=
        '    if (window.BBTelegramInvoiceShare?.afterComplete) {\n'
        +'      await window.BBTelegramInvoiceShare.afterComplete(payload, bbSavedInvoiceResult);\n'
        +'    }\n\n'
        +'    clearAllAfterSuccessfulSave();';

      if(!html.includes(bbInvoiceClearMarker)){
        throw new Error('Mobile Invoice Telegram post-save marker was not found.');
      }

      html=html.replace(
        bbInvoiceClearMarker,
        bbInvoiceTelegramBeforeClear
      );

      /*
       * Mobile CSS only.
       */
      const headClose=
        html.toLowerCase().indexOf('</head>');

      if(headClose<0){
        throw new Error('Invoice Generator source is missing </head>.');
      }

      html=
        html.slice(0,headClose)
        +'<link rel="stylesheet" href="mobile-invoice.css?v=20260925-currency2">\n'
        +'<link rel="stylesheet" href="mobile-invoice-preview.css?v=20260914-1">\n'
        +'<link rel="stylesheet" href="telegram-invoice-share-v1.css?v=20260920-digitalinvoice1">\n'
        +html.slice(headClose);

      /*
       * SAME CORE ORDER AS DESKTOP:
       *   1. Supabase adapter
       *   2. Batch guard
       *   3. Direct Sale stock source
       *   4. Google Sheet mirror
       *   5. Cash + Bank
       *
       * Then Mobile-only controllers.
       *
       * Desktop Product Picker is intentionally NOT loaded here.
       */
      const safeAdapter=
        adapterJs.replace(/<\/script/gi,'<\\/script');

      const featureScripts=
        '<scr'+'ipt>'+safeAdapter+'</scr'+'ipt>\n'
        +'<scr'+'ipt src="batch-v2-invoice-guard.js?v=20260910-2"></scr'+'ipt>\n'
        +'<scr'+'ipt src="direct-sale-source-v1.js?v=20260925-sellingunits1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="invoice-backup-v1.js?v=20260924-invoiceseq1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="split-payment-v1.js?v=20260925-mobile-desktopcore1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="mobile-invoice.js?v=20260925-editinvoice1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="invoice-price-comma-decimal-v1.js?v=20260925-1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="invoice-selling-units-v1.js?v=20260925-optional4"></scr'+'ipt>\n'
        +'<scr'+'ipt src="mobile-invoice-preview.js?v=20260914-1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="invoice-ar-summary-v1.js?v=20260921-textonly1"></scr'+'ipt>\n'
        +'<scr'+'ipt src="telegram-invoice-share-v1.js?v=20260920-arrealtime2"></scr'+'ipt>';

      const bodyCloseIndex=
        html.toLowerCase().lastIndexOf('</body>');

      if(bodyCloseIndex<0){
        throw new Error('Invoice Generator source is missing its closing body tag.');
      }

      html=
        html.slice(0,bodyCloseIndex)
        +featureScripts
        +'\n'
        +html.slice(bodyCloseIndex);

      document.open();
      document.write(html);
      document.close();

    }catch(error){
      console.error('Invoice Generator mobile loader failed:',error);

      const safeMessage=
        String(error?.message||error)
          .replace(
            /[&<>"']/g,
            c=>({
              '&':'&amp;',
              '<':'&lt;',
              '>':'&gt;',
              '"':'&quot;',
              "'":'&#039;'
            }[c])
          );

      document.body.innerHTML=
        '<div class="bb-loader">'
        +'<div class="bb-loader-card">'
        +'Could not open Invoice Generator'
        +'<div class="bb-loader-sub">'+safeMessage+'</div>'
        +'</div>'
        +'</div>';
    }
  })();
  </script>
</body>
</html>
